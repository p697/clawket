name = "clawket-registry-preview"
main = "src/index.ts"
compatibility_date = "2026-03-03"
workers_dev = true
account_id = "00000000000000000000000000000000"

[observability]
enabled = true

[vars]
RELAY_BACKEND = "openclaw"
# Set PAIRING_TICKET_SECRET with `wrangler secret put` on both Preview workers;
# never place that shared secret in this file.
RELAY_REGION_MAP = "{\"cn\":\"wss://clawket-relay-preview.example.workers.dev/ws\",\"sg\":\"wss://clawket-relay-preview.example.workers.dev/ws\",\"us\":\"wss://clawket-relay-preview.example.workers.dev/ws\",\"eu\":\"wss://clawket-relay-preview.example.workers.dev/ws\"}"
PAIR_ACCESS_CODE_TTL_SEC = "600"
PAIR_CLIENT_TOKEN_MAX = "8"
PAIR_PUBLIC_BASE_URL = "https://clawket-registry-preview.example.workers.dev"
PAIR_SESSION_RESOLVE_MAX_ATTEMPTS = "5"
APPLE_APP_IDS = "TEAMID.com.example.clawket"
ANDROID_APP_LINK_PACKAGE = "com.example.clawket"
ANDROID_APP_LINK_SHA256_CERT_FINGERPRINTS = ""

[[durable_objects.bindings]]
name = "PAIR_REGISTER_LIMITER"
class_name = "PairRegisterRateLimiter"

[[kv_namespaces]]
binding = "ROUTES_KV"
id = "00000000000000000000000000000000"

[[services]]
binding = "RELAY_SYNC_SERVICE"
service = "clawket-relay-preview"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairRegisterRateLimiter"]

name = "clawket-hermes-registry"
main = "src/index.ts"
compatibility_date = "2026-03-03"
workers_dev = true

[vars]
RELAY_BACKEND = "hermes"
# Checked-in templates must not point at the official hosted deployment by default.
# Replace these example endpoints and account-bound resource IDs before deploys or
# remote-binding workflows in your own account.
RELAY_REGION_MAP = "{\"cn\":\"wss://hermes-relay.example.com/ws\",\"sg\":\"wss://hermes-relay.example.com/ws\",\"us\":\"wss://hermes-relay.example.com/ws\",\"eu\":\"wss://hermes-relay.example.com/ws\"}"
PAIR_ACCESS_CODE_TTL_SEC = "600"
PAIR_CLIENT_TOKEN_MAX = "8"

[[durable_objects.bindings]]
name = "PAIR_REGISTER_LIMITER"
class_name = "PairRegisterRateLimiter"

[[kv_namespaces]]
binding = "HERMES_ROUTES_KV"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairRegisterRateLimiter"]

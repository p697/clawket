name = "clawket-hermes-relay-preview"
main = "src/index.ts"
compatibility_date = "2026-03-03"
workers_dev = false
# Replace this custom domain with a hostname in your own Cloudflare zone.
routes = [{ pattern = "clawket-hermes-relay-preview.example.com", custom_domain = true }]
account_id = "00000000000000000000000000000000"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[vars]
RELAY_BACKEND = "hermes"
# Create a dedicated Hermes Preview KV namespace and keep its ID only in the
# ignored wrangler.hermes.preview.local.toml copied from this template.
MAX_MESSAGES_PER_10S = "120"
MAX_CLIENT_MESSAGES_PER_10S = "300"
HEARTBEAT_INTERVAL_MS = "30000"
AWAITING_CHALLENGE_TTL_MS = "25000"
CLIENT_PONG_TIMEOUT_MS = "30000"
GATEWAY_PING_TIMEOUT_MS = "12000"
REGISTRY_VERIFY_URL = "https://clawket-hermes-registry-preview.example.com"
GATEWAY_OWNER_LEASE_MS = "20000"

[[durable_objects.bindings]]
name = "HERMES_ROOM"
class_name = "HermesRelayRoom"

[[kv_namespaces]]
binding = "HERMES_ROUTES_KV"
id = "00000000000000000000000000000000"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HermesRelayRoom"]

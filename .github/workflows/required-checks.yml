name: Required checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks and scan
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error "$base/$archive" -o "$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100

  desktop-bridge:
    name: Bridge and Relay compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run bridge:build
      - run: npm run bridge:test:required
      - run: node --test scripts/bridge/local-model-supervisor.test.mjs
      - run: npm run test:compat
      - run: npx vitest run tests/integration/local-model.e2e.test.ts

  required:
    name: Typecheck, tests, design system, and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: npm run check:required

      - name: Run v1 protocol compatibility replay
        run: npm run test:compat

      - name: Audit high-severity dependencies in both lockfiles
        run: |
          npm audit --audit-level=high
          npm --prefix apps/mobile audit --audit-level=high --workspaces=false

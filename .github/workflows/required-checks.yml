name: Required checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  required:
    name: Typecheck, tests, design system, and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: npm run check:required

      - name: Run v1 protocol compatibility replay
        run: npm run test:compat

      - name: Audit high-severity dependencies in both lockfiles
        run: |
          npm audit --audit-level=high
          npm --prefix apps/mobile audit --audit-level=high --workspaces=false
